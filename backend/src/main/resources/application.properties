spring.application.name=nextcalendar

spring.datasource.url=jdbc:h2:mem:nextcalendar
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Garante que o data.sql rode APÓS o Hibernate criar as tabelas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# JWT — troque o secret em produção por uma variável de ambiente
jwt.secret=nextcalendar-secret-key-must-be-at-least-256-bits-long-for-hs256
jwt.expiration-ms=86400000
