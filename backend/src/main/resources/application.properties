spring.application.name=nextcalendar

# ─── Banco de dados H2 (arquivo persistente) ──────────────────────────────────
# O arquivo fica em backend/data/nextcalendar.mv.db
# No H2 console, conecte-se com EXATAMENTE esta URL:
#   jdbc:h2:file:./data/nextcalendar
spring.datasource.url=jdbc:h2:file:./data/nextcalendar
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# update: mantém os dados entre restarts (não apaga tabelas existentes)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# data.sql só roda na criação inicial — com update+arquivo, evitamos re-inserir seeds
# Se precisar forçar re-seed, mude para always temporariamente
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# JWT — troque o secret em produção por uma variável de ambiente
jwt.secret=nextcalendar-secret-key-must-be-at-least-256-bits-long-for-hs256
jwt.expiration-ms=86400000
