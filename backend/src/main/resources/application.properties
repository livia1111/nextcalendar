spring.application.name=nextcalendar

# ── Datasource — H2 em modo FILE para persistir entre restarts ──────────────
# Troque pela URL do Postgres em produção via variável de ambiente DB_URL.
spring.datasource.url=jdbc:h2:file:./data/nextcalendar
spring.datasource.driverClassName=org.h2.Driver
# Externalizados: sobrescreva via DB_USERNAME / DB_PASSWORD em produção.
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# update: Hibernate ajusta schema sem destruir dados.
# TODO: mudar para "validate" assim que o Flyway controlar o schema por completo,
#       para evitar divergência entre migrations e o schema gerado automaticamente.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ── Flyway ───────────────────────────────────────────────────────────────────
# O seed do estabelecimento (UUID fixo) está em db/migration/V1__seed_default_establishment.sql
# baseline-on-migrate=true: permite rodar em schema pré-existente (criado pelo Hibernate ddl-auto=update)
# baseline-version=0: garante que a migration V1 seja executada após o baseline
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.sql.init.mode=never

# JWT — troque o secret em produção por uma variável de ambiente
jwt.secret=nextcalendar-secret-key-must-be-at-least-256-bits-long-for-hs256
jwt.expiration-ms=86400000
